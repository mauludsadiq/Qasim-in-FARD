replicaCount: 1

image:
  repository: qasim
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9801

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: qasim.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data

env:
  QASIM_DB_PATH: /data/qasim.db

secret:
  chainSecretHex: ""

livenessProbe:
  httpGet:
    path: /health
    port: 9801
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 9801
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
