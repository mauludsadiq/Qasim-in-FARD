apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qasim.fullname" . }}
  labels:
    {{- include "qasim.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "qasim.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qasim.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9801
              protocol: TCP
          env:
            - name: QASIM_DB_PATH
              value: {{ .Values.env.QASIM_DB_PATH }}
            - name: QASIM_CHAIN_SECRET_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ include "qasim.fullname" . }}-secret
                  key: chainSecretHex
            - name: QASIM_ADMIN_KEY_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "qasim.fullname" . }}-secret
                  key: adminKeyHash
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "qasim.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
